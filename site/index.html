<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Romoj Akhra</title>
  <meta name="description" content="Romoj Akhra — folk sessions and tribal beats from the Santal heartland, always playing." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <meta name="theme-color" content="#241a14" />
</head>
<body>
  <main class="stage">
    <div class="village-scene" aria-hidden="true">
      <img src="images/santal-dance.png" alt="" />
      <div class="scrim"></div>
    </div>

    <div class="content">
      <header class="header">
        <span id="clock" class="clock"></span>
        <button type="button" id="installBtn" class="install-btn" hidden>Install</button>
      </header>

      <div class="hero">
        <img src="images/romoj-akhra.png" alt="Romoj Akhra" class="logo" />
      </div>

      <div class="spacer"></div>

      <div class="player-wrap">
        <a id="openPlaylistLink" class="open-playlist" href="https://www.youtube.com/playlist?list=PLffCnobOvXsU" target="_blank" rel="noopener">
          Open playlist on YouTube ↗
        </a>

        <div id="tabs" class="tabs">
          <button type="button" class="tab" data-playlist="PLffCnobOvXsU">Old Song</button>

          <div class="year-menu-anchor">
            <button type="button" id="yearBtn" class="tab" aria-expanded="false">By Year ▾</button>
          </div>

          <button type="button" class="tab" data-playlist="PLaeR-8k9b6oo">Cover Song</button>
          <button type="button" class="tab" data-playlist="PLcQTTKWwcHx0">Instrumental</button>
        </div>

        <div class="player-card">
          <div class="yt-host-wrap"><div id="yt-host"></div></div>

          <div class="row">
            <div class="thumb-wrap">
              <img id="thumb" class="thumb" alt="" hidden />
              <svg id="thumbFallback" class="thumb-fallback" viewBox="0 0 24 24" fill="var(--rice)">
                <path d="M8 5v14l11-7z" />
              </svg>
            </div>

            <div class="info">
              <p id="title" class="title">Loading playlist…</p>
              <p id="author" class="author"></p>
            </div>

            <div class="controls">
              <button type="button" id="prevBtn" aria-label="Previous track" disabled>
                <svg viewBox="0 0 24 24" class="icon" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" /></svg>
              </button>
              <button type="button" id="playBtn" aria-label="Play" disabled>
                <svg id="playIcon" viewBox="0 0 24 24" class="icon icon-play" fill="currentColor"><path d="M8 5v14l11-7z" /></svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" class="icon" fill="currentColor" style="display: none"><path d="M7 5h4v14H7zm6 0h4v14h-4z" /></svg>
              </button>
              <button type="button" id="nextBtn" aria-label="Next track" disabled>
                <svg viewBox="0 0 24 24" class="icon" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l8.5 6L4 18z" /></svg>
              </button>
            </div>
          </div>

          <div class="progress-row">
            <div id="seek" class="seek" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuenow="0" tabindex="0">
              <div id="seekFill" class="seek-fill"></div>
            </div>
            <p id="time" class="time">0:00 / 0:00</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="yearPanel" class="year-panel" hidden>
    <button type="button" class="year-option" data-playlist="PLhXvuO8eMB22qUgrmpe9RYZKtLnArINNo">2021</button>
    <button type="button" class="year-option" data-playlist="PLhXvuO8eMB20eT0WGqrJURQPfu5hrhXMt">2023</button>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
